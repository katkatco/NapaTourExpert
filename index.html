<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napa Tour Expert</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #111;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
                  url("https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&fit=crop&w=1800&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px rgba(0,0,0,.6);
    }

    p {
      font-size: 1.4rem;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #8b0000;
      color: white;
      text-decoration: none;
      padding: 16px 34px;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: .3s;
    }

    .button:hover {
      background: #b22222;
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>Napa Tour Expert</h1>
    <p>Luxury Wine Country Experiences • Napa • Sonoma</p>
    <a class="button" href="#">Book Your Tour</a>
  </div>
</section>

</body>
</html>
